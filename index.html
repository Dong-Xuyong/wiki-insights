<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Wiki Insights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="dong-ui/theme.js"></script>
  <link rel="stylesheet" href="dong-ui/theme.css" />
  <link rel="stylesheet" href="styles.css?v=dashboard2" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>" />
</head>
<body>
  <a class="skip-link" href="#view-root">Skip to content</a>
  <div id="app">
    <header id="topbar">
      <button id="back-btn" class="icon-btn hidden" aria-label="Back">&#8592;</button>
      <div id="tab-toggle" class="hidden" role="tablist">
        <button id="tab-insights" type="button" data-panel="insights" class="seg active" role="tab" aria-controls="detail-body" aria-selected="true">Insights</button>
        <button id="tab-summary" type="button" data-panel="summary" class="seg" role="tab" aria-controls="detail-body" aria-selected="false" tabindex="-1">Summary</button>
        <button id="tab-concepts" type="button" data-panel="concepts" class="seg" role="tab" aria-controls="detail-body" aria-selected="false" tabindex="-1">Concepts</button>
      </div>
      <h1 id="topbar-title">Wiki Insights</h1>
      <button type="button" data-dong-theme-toggle aria-label="Toggle color theme"></button>
    </header>
    <main id="view-root" tabindex="-1">
      <div id="loading">Loading videos&hellip;</div>
    </main>
    <nav id="tabbar" aria-label="Primary navigation">
      <button type="button" data-tab="home" class="nav-tab active" aria-current="page">
        <span class="nav-icon" aria-hidden="true">&#8962;</span>
        <span>Home</span>
      </button>
      <button type="button" data-tab="browse" class="nav-tab">
        <span class="nav-icon" aria-hidden="true">&#9783;</span>
        <span>Browse</span>
      </button>
      <button type="button" data-tab="progress" class="nav-tab">
        <span class="nav-icon" aria-hidden="true">&#9734;</span>
        <span>Progress</span>
      </button>
    </nav>
    <div id="fab" class="fab hidden" aria-label="Actions">
      <button type="button" id="fab-copy" class="fab-btn" title="Copy" aria-label="Copy">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button>
      <button type="button" id="fab-share" class="fab-btn" title="Share" aria-label="Share">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      </button>
    </div>
  </div>
  <script src="app.js?v=dashboard2"></script>
</body>
</html>
